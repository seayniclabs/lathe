name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install external deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr ghostscript

      - name: Install Python deps
        run: |
          pip install -e ".[test]"
          pip install pip-audit

      - name: Generate test fixtures
        run: python tests/generate_fixtures.py

      - name: Run tests
        run: pytest -v --cov=lathe --cov-report=xml --cov-fail-under=40

      - name: Security audit
        run: pip-audit

      - name: Leakage scan
        run: |
          ! grep -ri "REDACTED\|REDACTED\|192\.168\.0" src/ || (echo "LEAK DETECTED" && exit 1)

      - name: Path traversal audit
        run: |
          ! grep -rn "os\.system\|subprocess\.call\|subprocess\.Popen.*shell=True" src/ || (echo "UNSAFE SHELL DETECTED" && exit 1)
