[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lathe-mcp"
version = "0.3.0"
description = "MCP bundle for anyone who handles files and media: images, PDFs, audio and video, and OCR, all on your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seaynic Labs" }]
# mcp is capped below 2: 2.x removed FastMCP, and unpinned installs crash.
dependencies = [
    "mcp[cli]>=1.27,<2",
    "Pillow>=10.0",
    "pydantic>=2.7",
]
keywords = ["mcp", "model-context-protocol", "files", "image", "pdf", "audio", "video", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/seayniclabs/lathe"

[project.optional-dependencies]
# Python extras. System programs (ffmpeg, tesseract, ghostscript) are installed separately; the health tool says which are missing.
pdf = ["pypdf>=4"]
ocr = ["pytesseract>=0.3.10"]
full = ["pypdf>=4", "pytesseract>=0.3.10"]
dev = ["pytest>=8", "pypdf>=4", "pytesseract>=0.3.10"]

[project.scripts]
lathe = "lathe.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lathe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ffmpeg: needs the ffmpeg and ffprobe programs",
    "requires_tesseract: needs the tesseract program and pytesseract",
    "requires_ghostscript: needs the ghostscript program and pypdf",
]
