[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lathe-mcp"
version = "0.2.1"
description = "File and media processing MCP server — resize, convert, optimize, extract."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [
    { name = "Seaynic Labs", email = "helloREDACTED" },
]
keywords = ["mcp", "file-processing", "image", "pdf", "audio", "video", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Text Processing",
]
dependencies = [
    "mcp[cli]",
    "Pillow",
    "httpx",
]

[project.urls]
Homepage = "https://seayniclabs.com"
Repository = "https://github.com/seayniclabs/lathe"

[project.optional-dependencies]
full = [
    "ffmpeg-python",
    "pytesseract",
    "pypdf",
]
test = [
    "pytest",
    "pytest-cov",
    "pip-audit",
    "pypdf",
]

[project.scripts]
lathe = "lathe.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lathe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ffmpeg: test requires ffmpeg binary",
    "requires_tesseract: test requires tesseract binary",
    "requires_ghostscript: test requires ghostscript binary",
]
